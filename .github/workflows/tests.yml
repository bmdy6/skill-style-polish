name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Python 3.9 builds are unavailable on Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic integration tests
        run: python -m unittest discover -s tests -v
      - name: Check synthetic example for leaks
        run: python scripts/check.py --leak-gate examples/spoken.example.md
